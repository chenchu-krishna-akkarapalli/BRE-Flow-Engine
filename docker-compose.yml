services:
  # 1. PostgreSQL 16 with Row-Level Security
  postgres:
    image: postgres:16-alpine
    container_name: flowbre_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bre_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bre_password}
      POSTGRES_DB: ${POSTGRES_DB:-bre_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bre_user} -d ${POSTGRES_DB:-bre_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 2. Redis 7: Cache, Singleflight, Nonce Store & SSE PubSub
  redis:
    image: redis:7-alpine
    container_name: flowbre_redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 3. FastAPI Core Business Rules Engine (BRE) & UAS
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowbre_fastapi_app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-FlowBRE Onboarding BRE Engine}
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-bre_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bre_password}
      - POSTGRES_DB=${POSTGRES_DB:-bre_db}
      - POSTGRES_PORT=5432
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PUBSUB_CHANNEL=alerts:super_admin:sla_breach
      - SECRET_KEY=${SECRET_KEY:-super-secret-jwt-key-flowbre-enterprise-2026}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CIBIL_ENGINE_BINARY=/usr/local/bin/cibil-cli
      - COI_ENGINE_BINARY=/usr/local/bin/coi-cli
      - ITR_ENGINE_BINARY=/usr/local/bin/itr-cli
      - OCR_REQUIRE_REAL=${OCR_REQUIRE_REAL:-false}
      - SLA_ALERT_THRESHOLD_MS=${SLA_ALERT_THRESHOLD_MS:-400.0}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-FlowBRE Onboarding <onboarding@resend.dev>}
      - FRONTEND_LOGIN_URL=${FRONTEND_LOGIN_URL:-http://localhost:3000/auth/login}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      # The local model that reads every payslip (service 8).
      - PAYSLIP_LLM_URL=http://ollama:11434
      - PAYSLIP_LLM_MODEL=${PAYSLIP_LLM_MODEL:-qwen2.5:7b-instruct}
      - PAYSLIP_LLM_TIMEOUT_S=${PAYSLIP_LLM_TIMEOUT_S:-180}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: everything but payslip reading works without it, and
      # payslip uploads answer 503 with a clear message until the model is up.
      ollama:
        condition: service_started
    # --timeout covers OCR plus a cold local-model call (PAYSLIP_LLM_TIMEOUT_S); at 30s
    # gunicorn killed the worker mid-upload while the model was loading onto the GPU.
    command: sh -c "alembic upgrade head && gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --timeout 240"
    restart: always

  # 4. Celery Worker for Asynchronous OCR & Document Extraction
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowbre_celery_worker
    volumes:
      - ./app:/app/app
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-bre_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bre_password}
      - POSTGRES_DB=${POSTGRES_DB:-bre_db}
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CIBIL_ENGINE_BINARY=/usr/local/bin/cibil-cli
      - COI_ENGINE_BINARY=/usr/local/bin/coi-cli
      - ITR_ENGINE_BINARY=/usr/local/bin/itr-cli
      - OCR_REQUIRE_REAL=false
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-FlowBRE Onboarding <onboarding@resend.dev>}
      - FRONTEND_LOGIN_URL=${FRONTEND_LOGIN_URL:-http://localhost:3000/auth/login}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      disable: true
    restart: always

  # 5. Flower: Real-Time Celery Task Dashboard
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowbre_flower
    ports:
      - "127.0.0.1:9007:9007"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
    command: python -m celery -A app.worker.celery_app flower --port=9007
    healthcheck:
      disable: true
    restart: always

  # 6. Next.js 16 Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: flowbre_frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=http://web:8000
    depends_on:
      - web
    restart: always

  # 7. Nginx API & Edge Reverse Gateway
  nginx:
    image: nginx:1.25-alpine
    container_name: flowbre_nginx
    ports:
      - "9000:9000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - frontend
    restart: always

  # 8. Ollama: the local model that reads payslips. Payslip text never leaves this
  # stack: no ports are published, only `web` reaches it on the compose network.
  # CPU by default; add docker-compose.gpu.yml on an NVIDIA host for ~10x speed.
  ollama:
    image: ollama/ollama:0.40.4
    container_name: flowbre_ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  # 9. One-shot model download into the ollama_models volume (~4.7 GB, first run
  # only; later runs find it cached). The only step that needs internet access.
  ollama-pull:
    image: ollama/ollama:0.40.4
    container_name: flowbre_ollama_pull
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${PAYSLIP_LLM_MODEL:-qwen2.5:7b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  ollama_models:
