[workspace]
members = [
    "crates/cibil-core",
    "crates/cibil-pdf",
    "crates/cibil-layout",
    "crates/cibil-semantic",
    "crates/cibil-domain",
    "crates/cibil-validation",
    "crates/cibil-graph"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "2.0"
log = "0.4"
lopdf = "0.42"
petgraph = "0.6"
indexmap = { version = "2.2", features = ["serde"] }
smallvec = { version = "1.11", features = ["serde"] }
rayon = "1.10"
rc4 = "0.1"
md-5 = "0.10"
sha2 = "0.10"
jsonschema = "0.26"
jiff = "0.2"
